<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garena 台灣玩家聲音儀表板</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  body { background:#0f172a; color:#e2e8f0; font-family:'Helvetica Neue',Arial,sans-serif; }
  .card { background:#1e293b; border-radius:12px; padding:20px; }
  .stat-num { font-size:2rem; font-weight:800; line-height:1; }
  canvas { max-height:220px; }
  .tab-btn { padding:6px 20px; border-radius:8px; font-size:13px; font-weight:600;
             cursor:pointer; transition:all 0.2s; border:1px solid #334155;
             color:#94a3b8; background:transparent; }
  .tab-btn.active { background:#3b82f6; color:#fff; border-color:#3b82f6; }
  .tab-btn:hover:not(.active) { background:#1e293b; color:#e2e8f0; }
</style>
</head>
<body class="min-h-screen p-6">

<!-- Header -->
<div class="mb-4">
  <div class="text-xs tracking-widest text-blue-400 uppercase mb-1">Garena 台灣玩家聲音儀表板</div>
  <h1 class="text-2xl font-bold text-white">週間回饋總覽</h1>
  <div class="text-sm text-slate-400 mt-1">資料區間：2026/03/18 – 2026/03/24&nbsp;&nbsp;&nbsp;最後更新：2026-03-24 02:23 UTC</div>
</div>

<!-- 遊戲切換分頁 -->
<div class="flex gap-2 mb-6">
  <button onclick="switchGame('all')"      id="tab-all"      class="tab-btn active">🎮 全部遊戲</button>
  <button onclick="switchGame('freefire')" id="tab-freefire" class="tab-btn">🔥 Free Fire</button>
  <button onclick="switchGame('aov')"      id="tab-aov"      class="tab-btn">⚔️ 傳說對決</button>
</div>

<!-- KPI 卡片 -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
  <div class="card">
    <div class="text-xs text-slate-400 mb-2">本週總回饋</div>
    <div class="stat-num text-white" id="kpi-total">0</div>
    <div class="text-xs text-slate-500 mt-1">則</div>
  </div>
  <div class="card">
    <div class="text-xs text-slate-400 mb-2">負面比例</div>
    <div class="stat-num text-red-400" id="kpi-neg-pct">0%</div>
    <div class="text-xs text-slate-500 mt-1" id="kpi-neg-n">0 則</div>
  </div>
  <div class="card">
    <div class="text-xs text-slate-400 mb-2">正面比例</div>
    <div class="stat-num text-green-400" id="kpi-pos-pct">0%</div>
    <div class="text-xs text-slate-500 mt-1" id="kpi-pos-n">0 則</div>
  </div>
  <div class="card">
    <div class="text-xs text-slate-400 mb-2">活躍來源</div>
    <div class="stat-num text-blue-400" id="kpi-sources">0</div>
    <div class="text-xs text-slate-500 mt-1">個平台</div>
  </div>
</div>

<!-- 圖表區 第一行 -->
<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 mb-6">
  <div class="card xl:col-span-2">
    <div class="text-xs text-slate-400 uppercase tracking-wider mb-3">每日回饋量趨勢</div>
    <canvas id="trendChart"></canvas>
  </div>
  <div class="card">
    <div class="text-xs text-slate-400 uppercase tracking-wider mb-3">回饋分類</div>
    <canvas id="catChart"></canvas>
  </div>
  <div class="card">
    <div class="text-xs text-slate-400 uppercase tracking-wider mb-3">情緒分布</div>
    <canvas id="sentChart"></canvas>
  </div>
</div>

<!-- 圖表區 第二行 -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
  <div class="card">
    <div class="text-xs text-slate-400 uppercase tracking-wider mb-3" id="kw-title">本週熱門關鍵詞</div>
    <canvas id="kwChart"></canvas>
    <div id="kw-empty" class="text-slate-500 text-sm hidden">本週無關鍵詞資料</div>
  </div>
  <div class="card">
    <div class="text-xs text-slate-400 uppercase tracking-wider mb-3">各平台回饋量</div>
    <canvas id="srcChart"></canvas>
    <div id="src-empty" class="text-slate-500 text-sm hidden">本週無資料</div>
  </div>
</div>

<!-- 最新明細 -->
<div class="card mb-6">
  <div class="text-xs text-slate-400 uppercase tracking-wider mb-3" id="table-title">最新回饋明細</div>
  <div class="overflow-x-auto">
    <table class="w-full text-left">
      <thead><tr class="border-b border-slate-600">
        <th class="py-2 px-3 text-xs text-slate-500 font-medium">日期</th>
        <th class="py-2 px-3 text-xs text-slate-500 font-medium">分類</th>
        <th class="py-2 px-3 text-xs text-slate-500 font-medium">情緒</th>
        <th class="py-2 px-3 text-xs text-slate-500 font-medium">摘要</th>
        <th class="py-2 px-3 text-xs text-slate-500 font-medium">關鍵詞</th>
        <th class="py-2 px-3 text-xs text-slate-500 font-medium">來源</th>
      </tr></thead>
      <tbody id="recentTbody"></tbody>
    </table>
  </div>
</div>

<!-- Footer -->
<div class="text-center text-xs text-slate-600 pb-4">
  Garena 台灣玩家聲音儀表板 · 資料來自 Google Play / App Store / PTT · Powered by Claude AI
</div>

const DATA_AOV = {"total": 0, "neg": 0, "pos": 0, "neg_pct": 0, "pos_pct": 0, "active_sources": 0, "cat_labels": ["客服問題", "活動反應", "Bug回報", "付費體驗", "遊戲體驗", "其他"], "cat_vals": [0, 0, 0, 0, 0, 0], "cat_colors": ["#F97316", "#3B82F6", "#EF4444", "#EAB308", "#22C55E", "#8B5CF6"], "sent_labels": ["正面", "負面", "中性"], "sent_vals": [0, 0, 0], "daily_labels": ["03/18", "03/19", "03/20", "03/21", "03/22", "03/23", "03/24"], "daily_vals": [0, 0, 0, 0, 0, 0, 0], "src_labels": [], "src_vals": [], "kw_labels": [], "kw_vals": [], "recent": []};

// ── Chart 初始化 ──────────────────────────────────────────────
const charts = {};

  data: { labels: [], datasets: [{ label: '回饋則數', data: [],
    borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.15)',
    borderWidth: 2, fill: true, tension: 0.4,
    pointBackgroundColor: '#3b82f6', pointRadius: 4 }] },
  options: {

  }
});

  type: 'doughnut',
  data: {
    labels: ["正面", "負面", "中性"],
    datasets: [{ data: [], backgroundColor: ["#22C55E", "#EF4444", "#94A3B8"], borderWidth: 0 }]
  },

// ── 切換遊戲 ──────────────────────────────────────────────────
function switchGame(game) {
  ['all', 'freefire', 'aov'].forEach(function(g) {
    var btn = document.getElementById('tab-' + g);
    if (g === game) { btn.classList.add('active'); }
    else { btn.classList.remove('active'); }
  });
  var data = (game === 'freefire') ? DATA_FF : (game === 'aov') ? DATA_AOV : DATA_ALL;
  updateDashboard(data);
}

function updateDashboard(data) {
  // KPI
  document.getElementById('kpi-total').textContent   = data.total;
  document.getElementById('kpi-neg-pct').textContent = data.neg_pct + '%';
  document.getElementById('kpi-neg-n').textContent   = data.neg + ' 則';
  document.getElementById('kpi-pos-pct').textContent = data.pos_pct + '%';
  document.getElementById('kpi-pos-n').textContent   = data.pos + ' 則';
  document.getElementById('kpi-sources').textContent = data.active_sources;

  // 趨勢
  charts.trend.data.labels = data.daily_labels;
  charts.trend.data.datasets[0].data = data.daily_vals;
  charts.trend.update();

  // 分類
  charts.cat.data.datasets[0].data = data.cat_vals;
  charts.cat.update();

  // 情緒
  charts.sent.data.datasets[0].data = data.sent_vals;
  charts.sent.update();

  // 關鍵詞
  var kwCanvas = document.getElementById('kwChart');
  var kwEmpty  = document.getElementById('kw-empty');
  if (data.kw_labels.length > 0) {
    kwCanvas.style.display = '';
    kwEmpty.classList.add('hidden');
    charts.kw.data.labels = data.kw_labels;
    charts.kw.data.datasets[0].data = data.kw_vals;
    charts.kw.update();
    document.getElementById('kw-title').textContent = '本週熱門關鍵詞 Top ' + data.kw_labels.length;
  } else {
    kwCanvas.style.display = 'none';
    kwEmpty.classList.remove('hidden');
  }

  // 來源
  var srcCanvas = document.getElementById('srcChart');
  var srcEmpty  = document.getElementById('src-empty');
  if (data.src_labels.length > 0) {
    srcCanvas.style.display = '';
    srcEmpty.classList.add('hidden');
    charts.src.data.labels = data.src_labels;
    charts.src.data.datasets[0].data = data.src_vals;
    charts.src.update();
  } else {
    srcCanvas.style.display = 'none';
    srcEmpty.classList.remove('hidden');
  }

  // 明細表格
  document.getElementById('table-title').textContent = '最新回饋明細（' + data.recent.length + ' 則）';
  var tbody = document.getElementById('recentTbody');
  tbody.innerHTML = '';
  data.recent.forEach(function(d) {
    var tr = document.createElement('tr');
    tr.className = 'border-b border-slate-700 hover:bg-slate-700/30 transition-colors';
    tr.innerHTML =
      '<td class="py-2 px-3 text-xs text-slate-400 whitespace-nowrap">' + d.date + '</td>' +
      '<td class="py-2 px-3"><span class="px-2 py-0.5 rounded-full text-xs font-bold" style="background:' + d.cat_color + '22;color:' + d.cat_color + '">' + d.cat + '</span></td>' +
      '<td class="py-2 px-3"><span class="px-2 py-0.5 rounded-full text-xs font-bold" style="background:' + d.sent_color + '22;color:' + d.sent_color + '">' + d.sent + '</span></td>' +
      '<td class="py-2 px-3 text-sm text-slate-200 max-w-xs truncate"><a href="' + d.url + '" target="_blank" class="hover:text-blue-400 transition-colors">' + d.summ + '</a></td>' +
      '<td class="py-2 px-3 text-xs text-slate-400">' + d.kws + '</td>' +
      '<td class="py-2 px-3 text-xs text-slate-500 whitespace-nowrap">' + d.src + '</td>';
    tbody.appendChild(tr);
  });
}
